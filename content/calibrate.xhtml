<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>

<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="marginalia-calibrate-window"
  title="Marginalia Extractor — Sample a colour"
  windowtype="marginalia-extractor-calibrate"
  width="900" height="720">

  <script src="calibrate.js"/>

  <html:style>
    html, body { margin: 0; padding: 0; }
    #mc-root { font: 13px -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
    #mc-header { padding: 10px 16px; border-bottom: 1px solid #ccc; }
    #mc-header h2 { margin: 0 0 4px; font-size: 15px; }
    #mc-help { color: #777; font-size: 0.9em; }
    #mc-stage { flex: 1; overflow: auto; padding: 10px; background: #f3f3f3; }
    #mc-canvas-wrap { position: relative; display: inline-block; }
    #mc-canvas { display: block; cursor: crosshair; border: 1px solid #999; background: #fff; }
    #mc-selection { position: absolute; border: 2px dashed #e5a000; pointer-events: none; display: none; }
    #mc-form { padding: 10px 16px; border-top: 1px solid #ccc; display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 12px; align-items: center; }
    #mc-form label { font-weight: 600; }
    #mc-swatch { width: 26px; height: 26px; border: 1px solid #888; border-radius: 4px; }
    #mc-readout { font-family: monospace; font-size: 0.85em; color: #555; }
    #mc-footer { padding: 10px 16px; border-top: 1px solid #ccc; display: flex; justify-content: flex-end; gap: 10px; }
    button.mc-btn { padding: 6px 16px; border-radius: 4px; border: 1px solid #bbb; background: #fafafa; cursor: pointer; }
    button.mc-primary { background: #2a7; color: #fff; border-color: #2a7; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      #mc-root { background: #1e1e1e; color: #ddd; }
      #mc-header, #mc-form, #mc-footer { border-color: #444; }
      #mc-stage { background: #151515; }
      #mc-help, #mc-readout { color: #999; }
      button.mc-btn { background: #333; color: #eee; border-color: #555; }
      button.mc-primary { background: #2a7; color: #fff; }
      #mc-form input, #mc-form select { background: #2a2a2a; color: #eee; border: 1px solid #555; }
    }
  </html:style>

  <vbox flex="1">
    <html:div id="mc-root">
      <html:div id="mc-header">
        <html:h2>Sample a colour from your scan</html:h2>
        <html:div id="mc-help">
          Open a page image, then click a highlighted/ink area (or drag over it).
          The HSV range is pre-filled and added to your colour mapping.
        </html:div>
      </html:div>
      <html:div id="mc-stage">
        <html:div style="margin-bottom:8px;">
          <html:button id="mc-open" class="mc-btn">Open image…</html:button>
          <html:span id="mc-file" style="margin-left:10px;font-size:0.85em;color:#777;"></html:span>
        </html:div>
        <html:div id="mc-canvas-wrap">
          <html:canvas id="mc-canvas" width="10" height="10"></html:canvas>
          <html:div id="mc-selection"></html:div>
        </html:div>
      </html:div>
      <html:div id="mc-form">
        <html:label for="mc-name">Name</html:label>
        <html:input type="text" id="mc-name" value="sampled" />
        <html:label for="mc-zotero">Zotero colour</html:label>
        <html:select id="mc-zotero">
          <html:option value="yellow">Yellow</html:option>
          <html:option value="red">Red</html:option>
          <html:option value="green">Green</html:option>
          <html:option value="blue">Blue</html:option>
          <html:option value="purple">Purple</html:option>
          <html:option value="magenta">Magenta</html:option>
          <html:option value="orange">Orange</html:option>
          <html:option value="grey">Grey</html:option>
        </html:select>
        <html:label for="mc-kind">Type</html:label>
        <html:select id="mc-kind">
          <html:option value="any">Any</html:option>
          <html:option value="highlighter">Highlighter</html:option>
          <html:option value="pen">Pen</html:option>
        </html:select>
        <html:label for="mc-tolerance">Hue tolerance</html:label>
        <html:input type="number" id="mc-tolerance" min="1" max="40" value="10" />
        <html:label>Sample</html:label>
        <html:div style="display:flex;align-items:center;gap:8px;">
          <html:div id="mc-swatch"></html:div>
          <html:span id="mc-readout">click the image</html:span>
        </html:div>
      </html:div>
      <html:div id="mc-footer">
        <html:button id="mc-cancel" class="mc-btn">Cancel</html:button>
        <html:button id="mc-add" class="mc-btn mc-primary">Add colour rule</html:button>
      </html:div>
    </html:div>
  </vbox>

</window>
